[project]
name = "okami-agent"
version = "0.11.0-beta"
description = "Okami Agent — reliable, self-improving coding agent with capability parity across LLMs"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "OkamiOps", email = "msant262@gmail.com" }]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
    "Operating System :: OS Independent",
]
dependencies = [
    "litellm>=1.50",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "questionary>=2.0",      # menus interativos (seta ↑↓) no setup/provider; fallback numerado embutido
    "prompt_toolkit>=3.0",   # REPL concorrente do `okami chat` (digita enquanto trabalha; patch_stdout)
    "textual>=0.80",         # TUI de tela cheia do `okami chat --tui` (regiões fixas, mouse, scroll, status pinado)
    "pillow>=10",            # render do logo REAL da Okami como arte de terminal (half-block); degrada p/ lobo geométrico
]

[project.optional-dependencies]
# ruff/bandit/pip-audit fixados aqui → `uv run ruff/bandit` reproduz a versão do lock (CI e local iguais).
dev = ["pytest>=8", "ruff>=0.6", "bandit>=1.7", "pip-audit>=2.7"]
honcho = ["honcho-ai>=1.0"]
voice = ["faster-whisper>=1.0", "edge-tts>=6.1"]
browser = ["playwright>=1.40"]      # browser automation (§13); sem ela, browse cai p/ fetch read-only
web = ["ddgs>=6.0"]                  # web_search zero-key (DuckDuckGo); sem ela, web_search pede o pip install

[project.scripts]
okami = "okami.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["okami"]

[tool.ruff]
# Gate de qualidade = `ruff check` (lint; o CI roda `uv run ruff check okami tests`). NÃO usamos
# `ruff format` DE PROPÓSITO: o estilo de comentários ALINHADOS (`x = 1        # nota`) é intencional —
# denso, mas legível — e o formatter colapsaria isso em ~230 arquivos, matando a leitura. Lint é a barra;
# format não é enforçado. Defaults do ruff (F + E4/E7/E9); exceções pontuais via `# noqa`.
target-version = "py311"

[tool.bandit]
# Postura de segurança VERSIONADA — fonte única p/ CI e local (`bandit -c pyproject.toml`).
# Okami é um agente de CÓDIGO: shelling out, urllib p/ provedores e cleanup best-effort são a FUNÇÃO,
# não acidentes. Liberamos essas famílias com motivo documentado e mantemos VIVOS os detectores de
# alto impacto — B602 (shell=True), B608 (SQLi), B104 (bind público) — individualizados por `# nosec`
# nos poucos sites benignos de hoje, pra que um caso REAL futuro ainda dispare.
exclude_dirs = ["tests", ".venv", "build", "dist"]
skips = [
    "B404",  # import subprocess — núcleo de um agente de código (git/docker/codex/PTY). B602 segue vivo.
    "B603",  # subprocess sem shell — sempre LISTA de args, nunca string (o perigoso é shell=True = B602).
    "B607",  # processo por path parcial — chamamos git/docker/codex/sh por nome de propósito (via PATH).
    "B606",  # os.execvp do PTY (ptyproc) — feature central do terminal, não exec acidental.
    "B105",  # "hardcoded password" — só falso positivo: dicts de ícone, chaves de policy, URLs OAuth públicas.
    "B110",  # try/except/pass — best-effort cleanup deliberado (comentado + noqa BLE001 nos sites).
    "B112",  # try/except/continue — idem: fallback best-effort em parse/stream.
    "B104",  # "bind all interfaces" — só falso positivo (allowlist de host LOCAL no mcp; detecção de bind
             # público no lint). O controle REAL de bind público é okami policy `forbid_public_bind`.
    "B608",  # SQL por f-string — só em okami/memory/sqlite_fts5 (schema FIXO, _COLS constante, valores
             # SEMPRE parametrizados por '?'); não existe SQL builder dinâmico/atacante-controlado.
    # B310 (urllib.urlopen): só infra p/ endpoints FIXOS/config (provedores/OAuth/Telegram/MCP/Paperclip).
    # URL atacante-controlada NÃO passa por aqui — passa por okami.core.net_guard.validate_public_url.
    "B310",
]
