# Uso (da raiz do repo):
#   docker compose -f deploy/docker-compose.yml build
#   docker compose -f deploy/docker-compose.yml run --rm okami doctor
#   docker compose -f deploy/docker-compose.yml run --rm okami task "crie hello.txt" -e file_exists:hello.txt
# host.docker.internal aponta um LMStudio na máquina host (api_base: http://host.docker.internal:PORT/v1).
services:
  okami:
    build:
      context: ..                 # build a partir da RAIZ do repo (copia okami/, tests/, etc.)
      dockerfile: deploy/Dockerfile
    image: okami-agent
    volumes:
      - ../:/app
    working_dir: /app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    stdin_open: true
    tty: true
