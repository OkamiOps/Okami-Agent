<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Variante: {postura}</title>
  <!-- troque pela Google Font indicada na skill design-systems, se estiver ancorando num sistema real -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-bg: #fafafa;
      --color-fg: #1a1a1a;
      --color-accent: #0066ff;
      --color-muted: #666;
      --radius: 8px;
      --font-display: 'Inter', system-ui, sans-serif;
      --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    body {
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
      color: var(--color-fg);
      background: var(--color-bg);
      line-height: 1.5;
    }
    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }
    h1, h2, h3 {
      font-family: var(--font-display);
      line-height: 1.2;
    }
    button, .btn {
      font: inherit;
      cursor: pointer;
      border: none;
      border-radius: var(--radius);
      padding: 0.6rem 1.2rem;
      background: var(--color-accent);
      color: #fff;
      transition: opacity 0.15s ease;
    }
    button:hover, .btn:hover { opacity: 0.85; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Título real, não "Lorem Ipsum"</h1>
    <p>Conteúdo falso mas plausível — frase que soa como algo que um usuário real leria.</p>
    <button type="button" onclick="this.textContent = this.textContent === 'Clique aqui' ? 'Feito!' : 'Clique aqui'">
      Clique aqui
    </button>
  </div>
</body>
</html>
