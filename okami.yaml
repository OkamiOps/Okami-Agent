default_provider: lmstudio
memory:
  backend: sqlite-fts5
  global: true            # memória GLOBAL (~/.okami): scope=global vale em qualquer projeto; projeto não contamina projeto
  embedder:
    enabled: true
    api_base: http://localhost:4480/v1   # aponte p/ seu LMStudio em okami.local.yaml (não versionado)
    model: text-embedding-nomic-embed-text-v1.5
  holographic:
    dim: 1024
  files:
    soul: 6000
    voice: 6000
    persona: 6000
    agents: 4000
    user: 4000
    memory: 4000
contracts:
  ui:
    library: shadcn
    component_source: '@/components/ui'
    forbid_inline_hex: true
    forbid_raw_css: true
    require_component_source: true
learning:
  auto_skill: true            # evolutivo: destila skill de tarefa não-trivial (toda skill passa pelo scan §4.5)
retention:                    # poda/quota de disco (gateway long-running não morre em disco). Operacionalize
                              # no cron: `okami clean --deep` (ou `--dry-run --json` p/ auditar). Ver docs/PRODUCTION.md.
  sessions:     {days: 30, keep: 10}     # transcripts ARQUIVADOS (*.reset.jsonl)
  checkpoints:  {days: 14, keep: 50}     # snapshots (journal.jsonl é preservado sempre)
  tool_outputs: {days: 7,  keep: 200}    # step_*.txt de output grande (cresce rápido)
  processes:    {ttl_hours: 24}          # processos em background já terminados
  audio:        {enabled: true}          # voz/TTS temporário
  quota_mb:     {tool_outputs: 500, checkpoints: 200, sessions: 200}   # 0/ausente = sem teto; >0 = aviso no status
gateway:                      # bots de Telegram (1 por agente)
  reactions: true             # reage à mensagem: 👀 processando · 👍 feito · 👎 erro (Telegram). Desligue com false.
  # auto_resume: false        # retoma tarefa interrompida no boot (com guarda anti-loop)
  # max_sessions: 500         # poda sessões antigas

voice:                        # Telegram (áudio). Requer deps: uv sync --extra voice
  stt:
    backend: whisper          # áudio recebido → texto (faster-whisper local)
    model: small
  tts:
    enabled: true             # responde em áudio (Edge TTS, grátis)
    backend: edge
    voice: pt-BR-AntonioNeural
providers:
  lmstudio:
    model: openai/qwen3.5-4b-mtp
    api_base: http://localhost:4480/v1   # aponte p/ seu LMStudio em okami.local.yaml (não versionado)
    # PLACEHOLDER local, NÃO é segredo: LMStudio/Ollama ignoram a chave (servidor OpenAI-compat local).
    # O lint reconhece 'lm-studio' como placeholder documentado (não vira warn). Servidor remoto → ${ENV}.
    api_key: lm-studio
    auth: api_key
    tier: local
    context_window: 32768
    capability:
      tool_mode: json_constrained
    models:
    - qwen3.6-35b-a3b-mtp
    - qwen3.5-9b-mtp
    - qwen3.5-4b-mtp
    - qwen3.5-2b-mtp
    - google/gemma-4-26b-a4b
    notes: Liste os modelos com 'okami doctor'. Troque o model à vontade.
  codex:
    model: openai-codex/gpt-5.5
    fallback: [claude, minimax, lmstudio]   # se o codex cair (529/timeout/vazio) → tenta estes, em ordem
    auth: oauth_subscription
    transport: codex_oauth
    tier: strong
    context_window: 256000
    reasoning_effort: high      # raciocínio forte por padrão (minimal|low|medium|high). Troque c/ /think.
    models:
    - gpt-5.5
    - gpt-5.4
    - gpt-5.4-mini
    - gpt-5.3-codex-spark
    notes: 'Login: okami login codex (device flow; habilite Device Code no ChatGPT).'
  claude:
    model: claude-subscription/claude-opus-4-8
    fallback: [codex, minimax, lmstudio]
    auth: oauth_subscription
    transport: claude_cli
    tier: strong
    context_window: 200000
    models:
    - claude-opus-4-8
    - claude-sonnet-4-6
    - claude-haiku-4-5-20251001
    notes: Usa o CLI `claude` (assinatura/OAuth/refresh cuidados pelo CLI). NÃO usar
      ANTHROPIC_API_KEY pay-as-you-go (ToS restringe reuse direto do token).
  minimax:                      # Token Plan (assinatura) via Subscription Key — OpenAI-compat (docs/token-plan)
    model: openai/MiniMax-M3
    # failover NÃO termina no local: nem sempre tem LMStudio. Cai p/ os de assinatura (remoto) e o local
    # por último — o harness pula automaticamente quem não está autenticado/disponível.
    fallback: [codex, claude, lmstudio]
    api_base: https://api.minimax.io/v1   # OpenAI-compat: POST /v1/chat/completions. China: https://api.minimaxi.com/v1
    api_key_env: MINIMAX_API_KEY  # Subscription Key do Token Plan (Account ▸ Token Plan). Bearer. Só no .env.
    auth: api_key
    tier: weak
    context_window: 1000000
    capability:
      # FORÇA o protocolo de ação (JSON válido via response_format) — sem isto um modelo fraco/reasoning
      # responde em TEXTO e NÃO chama tool. É o mesmo modo do LMStudio. (M3 OpenAI-compat suporta.)
      tool_mode: json_constrained
    models:                       # https://platform.minimax.io/docs/api-reference/text-chat-openai
    - MiniMax-M3
    - MiniMax-M2.7
    - MiniMax-M2.5
    - MiniMax-M2.1
    notes: 'Token Plan (assinatura): pegue a Subscription Key em Account ▸ Token Plan e rode
      `okami config set MINIMAX_API_KEY <key>` (vai pro .env). OpenAI-compat — sem OAuth.'
  mimo:                          # Xiaomi MiMo Token Plan (assinatura) — OpenAI-compat, endpoint REGIONAL token-plan
    model: openai/mimo-v2.5-pro
    fallback: [codex, claude, lmstudio]   # não termina no local (ver minimax) — o harness pula indisponível
    # Endpoint do TOKEN PLAN (não é platform.xiaomimimo.com). Europa (mais perto do BR) por padrão;
    # troque a região: -sgp (Singapura) · -cn (China). https://platform.xiaomimimo.com/docs token plan.
    api_base: https://token-plan-ams.xiaomimimo.com/v1
    api_key_env: MIMO_API_KEY     # chave 'tp-xxxxx' da Subscription Management. Bearer. Só no .env.
    auth: api_key
    tier: weak
    context_window: 128000
    capability:
      tool_mode: json_constrained   # força o protocolo de ação (senão modelo fraco só conversa, não chama tool)
    models:
    - mimo-v2.5-pro
    - mimo-v2.5
    notes: EXPERIMENTAL. MiMo via API key no .env (MIMO_API_KEY); resposta da API ainda em ajuste.
