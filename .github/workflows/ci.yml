name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1 (pin por SHA)
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5 (pin por SHA)
        with:
          enable-cache: true
      - name: Pin Python
        run: uv python install 3.12
      - name: Sync (locked, dev + voice)
        run: uv sync --frozen --extra dev --extra voice
      - name: Tests
        run: uv run pytest -q
      - name: Build wheel + sdist
        run: uv build
      - name: Smoke — installed package runs outside the checkout
        run: |
          uv run --no-project --with dist/*.whl okami --help >/dev/null
          echo "pacote instalado roda ✓"

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1 (pin por SHA)
        with:
          fetch-depth: 0
      - name: Nenhum segredo versionado
        run: |
          set -e
          if git ls-files | grep -E '(^|/)\.env$' ; then echo "::error::.env está versionado"; exit 1; fi
          if git ls-files | grep -E 'okami\.local\.yaml$' ; then echo "::error::okami.local.yaml está versionado"; exit 1; fi
          # padrões óbvios de chave em arquivos versionados (ignora locks e exemplos)
          if git grep -nIE '(sk-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----)' \
               -- . ':!*.lock' ':!*.example.*' ; then
            echo "::error::possível segredo versionado"; exit 1
          fi
          echo "sem segredos versionados ✓"

  # Hardening de supply-chain (P1.5): agora é GATE (sem `|| true`). Falha a CI se houver problema.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1 (pin por SHA)
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5 (pin por SHA)
        with:
          enable-cache: true
      - name: Ruff — estilo + regras de segurança (GATE)
        run: uvx ruff check okami tests
      - name: Bandit — HIGH severity é GATE (use `# nosec <ID>` justificado p/ exceções)
        run: uvx bandit -r okami --severity-level high --confidence-level medium -q
      - name: Bandit — relatório MEDIUM+ (informativo, não bloqueia)
        run: uvx bandit -r okami --severity-level medium -q || true
      - name: pip-audit — CVE high/critical é GATE
        run: |
          # --no-hashes: o pacote editável (-e .) não pode exigir hash; pip-audit pula o self-package.
          uv export --frozen --no-dev --no-hashes -o /tmp/reqs.txt
          uvx pip-audit -r /tmp/reqs.txt
