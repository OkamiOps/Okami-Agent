name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1 (pin por SHA)
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5 (pin por SHA)
        with:
          enable-cache: true
      - name: Pin Python
        run: uv python install 3.12
      - name: Sync (locked, dev + voice)
        run: uv sync --frozen --extra dev --extra voice
      - name: Tests
        run: uv run pytest -q
      - name: Policy conformance (GATE) — okami.policy.yaml vs config
        # `>` (sem pipe) preserva o exit code do okami → gate de verdade; o JSON vira artefato.
        run: |
          uv run okami policy check --json > policy-conformance.json
          cat policy-conformance.json
      - name: Upload conformance artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4 (pin por SHA)
        with:
          name: policy-conformance
          path: policy-conformance.json
      - name: Build wheel + sdist
        run: uv build
      - name: Smoke — installed package runs outside the checkout
        run: |
          uv run --no-project --with dist/*.whl okami --help >/dev/null
          echo "pacote instalado roda ✓"

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1 (pin por SHA)
        with:
          fetch-depth: 0
      - name: Scanner rápido (padrões óbvios; compartilhado com o pytest)
        # Fonte única: scripts/secret-scan.sh (mesmo do tests/test_secret_scan.py). Vetor fake de teste
        # leva `# pragma: allowlist secret` (explícito/auditável); o resto é scan forte.
        run: bash scripts/secret-scan.sh
      - name: gitleaks (scan PROFUNDO — alta-entropia + ~150 regras; GATE, working tree)
        # Complementa o scanner rápido com o ruleset oficial. Binário PINADO por versão; --no-git
        # = working tree (mesmo escopo do scanner rápido, sem falso-positivo de histórico antigo).
        run: |
          VER=8.21.2
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks detect --no-git --config .gitleaks.toml --redact --no-banner --verbose --exit-code 1

  # Hardening de supply-chain (P1.5): agora é GATE (sem `|| true`). Falha a CI se houver problema.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1 (pin por SHA)
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5 (pin por SHA)
        with:
          enable-cache: true
      - name: Sync (locked, dev) — ruff/bandit/pip-audit vêm do lock (versão reproduzível)
        run: uv sync --frozen --extra dev
      - name: Ruff — estilo + regras (GATE; versão travada no uv.lock)
        run: uv run ruff check okami tests
      - name: Bandit — HIGH severity é GATE (use `# nosec <ID>` justificado p/ exceções)
        run: uv run bandit -r okami --severity-level high --confidence-level medium -q
      - name: Bandit — relatório MEDIUM+ (informativo, não bloqueia)
        run: uv run bandit -r okami --severity-level medium -q || true
      - name: pip-audit — CVE high/critical é GATE
        run: |
          # --no-hashes: o pacote editável (-e .) não pode exigir hash; pip-audit pula o self-package.
          uv export --frozen --no-dev --no-hashes -o /tmp/reqs.txt
          uv run pip-audit -r /tmp/reqs.txt
      - name: Semgrep — análise estática de segurança (GATE; substitui o CodeQL)
        # CodeQL exige GitHub Advanced Security (repo privado não tem) → SARIF upload sempre falhava.
        # Semgrep roda 100% no runner e mostra os achados no log. Excluímos só a regra dynamic-urllib
        # (redundante: URLs do usuário/modelo passam por okami/core/net_guard anti-SSRF, e o resto são
        # endpoints de config; já coberto por ruff S310). shell=True legítimo leva `# nosemgrep`.
        run: >
          uvx --from semgrep semgrep scan --config p/security-audit --error --metrics off
          --exclude-rule python.lang.security.audit.dynamic-urllib-use-detected.dynamic-urllib-use-detected
          okami
