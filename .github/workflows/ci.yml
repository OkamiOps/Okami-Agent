name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1 (pin por SHA)
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5 (pin por SHA)
        with:
          enable-cache: true
      - name: Pin Python
        run: uv python install 3.12
      - name: Sync (locked, dev + voice)
        run: uv sync --frozen --extra dev --extra voice
      - name: Tests
        run: uv run pytest -q
      - name: Build wheel + sdist
        run: uv build
      - name: Smoke — installed package runs outside the checkout
        run: |
          uv run --no-project --with dist/*.whl okami --help >/dev/null
          echo "pacote instalado roda ✓"

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1 (pin por SHA)
        with:
          fetch-depth: 0
      - name: Nenhum segredo versionado
        run: |
          set -e
          if git ls-files | grep -E '(^|/)\.env$' ; then echo "::error::.env está versionado"; exit 1; fi
          if git ls-files | grep -E 'okami\.local\.yaml$' ; then echo "::error::okami.local.yaml está versionado"; exit 1; fi
          # padrões óbvios de chave em arquivos versionados (ignora locks e exemplos)
          if git grep -nIE '(sk-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----)' \
               -- . ':!*.lock' ':!*.example.*' ; then
            echo "::error::possível segredo versionado"; exit 1
          fi
          echo "sem segredos versionados ✓"

  # Hardening de supply-chain (P2). Informativo por enquanto (|| true) — vira gate quando triado.
  # TODO: pinar as actions por SHA (não por @v4/@v5) e gerar SBOM/assinatura no release.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1 (pin por SHA)
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5 (pin por SHA)
        with:
          enable-cache: true
      - name: Ruff — estilo + regras de segurança (informativo)
        run: uvx ruff check okami tests || true
      - name: Bandit — segurança Python (informativo)
        run: uvx bandit -r okami -ll || true
      - name: pip-audit — CVEs de dependência / OSV (informativo)
        run: |
          uv export --frozen --no-dev -o /tmp/reqs.txt 2>/dev/null \
            || uv export --frozen -o /tmp/reqs.txt 2>/dev/null || : > /tmp/reqs.txt
          uvx pip-audit -r /tmp/reqs.txt || true
