name: Production conformance (strict)

# Gate de PRONTIDÃO para GA (postura de produção/hostil). SEPARADO do ci.yml de propósito: o repo
# em modo dogfood reprova `--strict` (agentes expostos sem isolamento estrito), então isto NÃO bloqueia
# o merge — é um artefato de prontidão, rodado sob demanda (antes de um deploy) e semanalmente.
on:
  workflow_dispatch: {}       # manual: rode antes de expor o agente publicamente
  schedule:
    - cron: "0 6 * * 1"       # segunda 06:00 UTC (informativo)

permissions:
  contents: read

jobs:
  strict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1 (pin por SHA)
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5 (pin por SHA)
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Policy strict — artefato de conformance de GA (informativo, não bloqueia)
        run: |
          uv run okami policy check --strict --json > strict-conformance.json || true
          cat strict-conformance.json
      - name: Upload conformance artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4 (pin por SHA)
        with:
          name: strict-conformance
          path: strict-conformance.json
