name: Production conformance (strict)

# Gate de PRONTIDÃO para GA (postura de produção/hostil). SEPARADO do ci.yml de propósito.
#
# DOIS MODOS:
#   • informativo (cron semanal / dispatch sem enforce): roda --strict e SÓ publica o artefato — o
#     repo em dogfood reprova strict (agentes expostos sem isolamento estrito), então NÃO bloqueia.
#   • BLOQUEANTE (dispatch com enforce=true, OU push de tag v*): o `--strict` é GATE de verdade — um
#     deploy/release público só passa se a postura de produção estiver conforme. É o gate de GA.
on:
  workflow_dispatch:
    inputs:
      enforce:
        description: "Bloquear o job se a conformance estrita falhar (gate de release)?"
        type: boolean
        default: false
  push:
    tags: ["v*"]            # release público → strict é OBRIGATÓRIO (bloqueante)
  schedule:
    - cron: "0 6 * * 1"     # segunda 06:00 UTC (informativo)

permissions:
  contents: read

jobs:
  strict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1 (pin por SHA)
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5 (pin por SHA)
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Decide o modo (tag v* OU enforce=true → bloqueante)
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.enforce }}" = "true" ]; then
            echo "blocking=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Conformance ESTRITA em modo BLOQUEANTE (release/enforce)."
          else
            echo "blocking=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Conformance estrita em modo informativo (dogfood reprova de propósito)."
          fi
      - name: Policy strict — gera o artefato (sempre)
        run: |
          uv run okami policy check --strict --json > strict-conformance.json || true
          cat strict-conformance.json
      - name: Upload conformance artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4 (pin por SHA)
        with:
          name: strict-conformance
          path: strict-conformance.json
      - name: GATE — falha o job se bloqueante e strict reprovar
        if: steps.mode.outputs.blocking == 'true'
        run: |
          # `>` sem pipe preserva o exit do okami → gate de verdade no modo release/enforce.
          uv run okami policy check --strict --json > /dev/null
